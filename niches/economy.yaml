# 경제 니치 설정 — seed_topics 를 자유롭게 바꿔 원하는 주제를 넣으세요.
niche: economy
korean: 경제

# 시드 주제(자동완성/연관검색어/DataLab 발굴의 출발점)
seed_topics:
  - 기준금리
  - 물가상승
  - 환율 전망
  - 경제 용어
  - 예금 금리 비교

# 니치 관련 토큰(포함 시 선정 점수 가산)
include_tokens:
  - 경제
  - 금리
  - 물가
  - 환율
  - 인플레이션
  - 예금
  - 적금
  - 대출
  - GDP
  - 재테크

# 제외어(포함 시 후보에서 제거 — 무관/부적절 주제 차단)
exclude_terms:
  - 성인
  - 도박
  - 불법

# 콘텐츠 앵글(글감마다 순환 배정)
angles:
  - 초보자를 위한 쉬운 개념 설명
  - 이번 주 경제 이슈 정리
  - 개인에게 미치는 영향과 대응
  - 사례로 이해하는 경제
