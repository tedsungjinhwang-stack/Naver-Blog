# ==========================================================================
# nbpipe 설정 파일
#   cp config/config.example.yaml config/config.yaml
# config/config.yaml 은 .gitignore 처리되어 있습니다. (개인 설정 보호)
# 비밀키(API 키)는 여기가 아니라 .env 에 넣으세요.
# ==========================================================================

# 본문은 이 세션의 Claude(또는 사람)가 직접 작성합니다. (자동 API 생성 없음)
# nbpipe brief 로 작성 브리핑을 만들고, 글을 쓴 뒤 nbpipe ingest 로 검수/출력합니다.

collectors:
  seed_topics: true          # 사용자가 지정한 주제
  naver_autocomplete: true   # 네이버 검색 자동완성 (무료, 키 불필요)
  naver_related: false       # ⚠️ 네이버 연관검색어 2026-04-30 서비스 종료 → 기본 off
  naver_datalab: false       # DataLab 검색어 트렌드 (.env 에 NAVER_CLIENT_ID/SECRET 필요)
  google_trends: false       # 구글 트렌드 (pip install pytrends 필요)
  request_delay_sec: 0.7     # 요청 간 지연(초) — 과도한 크롤링 방지
  timeout_sec: 8
  autocomplete_depth: 1      # 자동완성 확장 깊이(0=시드만, 1=시드+각 결과 재조회)

keyword_selection:
  max_keywords_per_topic: 12
  # 소스별 신뢰 가중치(스코어 = Σ 소스가중치 × 순위감쇠)
  source_weight:
    seed_topics: 1.0
    naver_datalab: 1.0
    naver_autocomplete: 0.9
    naver_related: 0.85
    google_trends: 0.7
  # 여러 소스에 동시 등장하면 가산(교차검증 보너스)
  cross_source_bonus: 0.25

seo:
  # 아래 임계값은 knowledge/hompan.md 리서치 결과 기반(비공식 경험칙 → 조정 가능).
  title_len_min: 12
  title_len_max: 30        # 모바일 잘림 방지(리서치: 25자 이내 권장)
  body_char_min: 1700      # 검색형 하한. 홈피드형은 2,000자+ (intent별 자동 상향)
  min_headings: 3          # 소제목(목차) 2~4개
  min_images: 6            # 리서치: 6~13장(검색형 최소 3~5장)
  tags_min: 5
  tags_max: 10
  primary_keyword_min_count: 3
  primary_keyword_max_count: 6   # 본문 6회 초과 시 스터핑 경고
  pass_score: 70          # 이 점수 이상이면 '발행 권장'

output:
  dir: ./output
  # markdown=검토용, html=미리보기용, naver_text=네이버 붙여넣기용(.naver.txt)
  formats: [markdown, html, naver_text]
  write_run_log: true         # SQLite 실행 로그 기록

writing:
  # 모든 초안에 고정할 '종결 어투' 규칙. 비워두면 기본 규칙(메르 방식) 사용.
  # 기본: 도입부 1~2문장만 존댓말, 그 이후 본문·마무리까지 전부 개조식 음슴체(~함/~됨/~임).
  # 다르게 통일하고 싶으면 아래를 채워 덮어쓰세요. 예)
  # voice_rule: "모든 문장을 '~습니다' 존댓말 대화체로 통일한다."
  voice_rule: ""
